# Měsíčně stáhne indexy z ČSÚ:
#  - index nájmů → indexy/najemne-cpi.json (docs/10-novy-najem.md)
#  - indexy realizovaných cen bytů → indexy/ceny-bytu.json (docs/12-odhad-trzni-ceny.md)
# ČSÚ zveřejňuje inflaci kolem 10. dne v měsíci, proto běh 12. a pro jistotu 20.
# Selže-li jedno stahování, druhé se přesto spustí; GitHub pošle e-mail o neúspěšném běhu a data se nepřepíšou.
name: Indexy z ČSÚ (nájmy a ceny bytů)

on:
  schedule:
    - cron: "17 5 12,20 * *"
  workflow_dispatch: {}
  # při změně tohoto souboru se úloha spustí hned (ověření, že funguje)
  push:
    branches: [main]
    paths: [".github/workflows/indexy.yml"]

permissions:
  contents: write

jobs:
  stahni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nainstalovat openpyxl (čtení XLSX od ČSÚ)
        run: python -m pip install openpyxl
      - name: Stáhnout index nájmů z ČSÚ
        run: python tools/stahni_inflaci_najmu.py
      - name: Stáhnout indexy cen bytů z ČSÚ
        if: ${{ !cancelled() }}
        run: python tools/stahni_index_cen_bytu.py
      - name: Uložit, pokud se něco změnilo
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain -- indexy/)" ]; then
            echo "Beze změny."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add indexy/
          git commit -m "Indexy z ČSÚ: aktualizace dat"
          git push
