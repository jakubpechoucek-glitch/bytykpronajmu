<!doctype html>
<html lang="cs" class="auth-ceka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Byty k pronájmu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/">Byty k&nbsp;pronájmu</a>
    <nav id="nav" aria-label="Byty"></nav>
    <div class="who" id="who"></div>
  </div>
</header>
<div class="demo-banner" id="demo-banner" hidden>Ukázkový režim – smyšlená data, změny se neukládají.</div>
<main id="main"><p class="muted">Načítám…</p></main>

<dialog id="dlg">
  <form id="dlg-form" novalidate>
    <h2 id="dlg-title"></h2>
    <div class="fields" id="dlg-fields"></div>
    <p class="err" id="dlg-err" hidden></p>
    <div class="dlg-actions">
      <button type="button" class="btn danger" id="dlg-del" hidden>Smazat</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="dlg-cancel">Zrušit</button>
      <button type="submit" class="btn primary">Uložit</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/rozcestnik/vendor/supabase-js-2.45.4.js"></script>

<script src="js/finance.js"></script>
<script src="js/data.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
